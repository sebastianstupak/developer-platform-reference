name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore developer-platform-reference.slnx

      - name: Build
        run: dotnet build developer-platform-reference.slnx --no-restore -c Release

      # Unit / integration / architecture tests use in-memory EF Core and mocked
      # HTTP, so no MariaDB / RabbitMQ / Redis containers are needed here.
      - name: Test
        run: dotnet test developer-platform-reference.slnx --no-build -c Release --verbosity minimal

      - name: Format check
        run: dotnet format developer-platform-reference.slnx --verify-no-changes --verbosity minimal
