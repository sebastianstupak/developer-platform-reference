name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The API host connects to RabbitMQ synchronously at startup and the
      # WebApplicationFactory integration tests boot that host, so the backing
      # services must be up. Keycloak is not needed (JWT metadata is lazy).
      - name: Start backing services
        run: docker compose up -d --wait db rabbitmq redis

      - name: Restore
        run: dotnet restore developer-platform-reference.slnx

      - name: Build
        run: dotnet build developer-platform-reference.slnx --no-restore -c Release

      - name: Apply EF migrations
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          dotnet ef database update \
            --project src/DeveloperPlatform.Infrastructure \
            --startup-project src/DeveloperPlatform.Api

      - name: Test
        run: dotnet test developer-platform-reference.slnx --no-build -c Release --verbosity minimal --filter "Category!=E2E"

      - name: Format check
        run: dotnet format developer-platform-reference.slnx --verify-no-changes --verbosity minimal
