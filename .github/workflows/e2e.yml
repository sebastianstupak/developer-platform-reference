name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright e2e (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore developer-platform-reference.slnx
      - name: Build solution
        run: dotnet build developer-platform-reference.slnx -c Release --no-restore
      - name: Install Playwright browsers
        run: pwsh tests/DeveloperPlatform.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run e2e
        run: dotnet test tests/DeveloperPlatform.E2ETests -c Release --no-build --logger "console;verbosity=detailed"
